repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
    -   id: ruff
        args: ["--fix", "soundconverter", "bin/soundconverter.py.in"]
    -   id: ruff-format
        args: ["--check", "soundconverter", "bin/soundconverter.py.in"]

-   repo: local
    hooks:
    -   id: pytest-unit
        name: pytest unit tests
        entry: python3 -m pytest tests/testcases/ -x -q --tb=short
        language: system
        pass_filenames: false
        types: [python]
